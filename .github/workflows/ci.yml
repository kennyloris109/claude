name: Build and validate

on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:content
      - run: npm run build

  indexnow:
    # Pings search engines after a push to the default (production) branch. Set the repository variable SITE_LIVE=true
    # (Settings → Secrets and variables → Actions → Variables) once the domain is live.
    needs: build
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && vars.SITE_LIVE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Wait for Cloudflare Pages to finish deploying
        run: sleep 180
      - run: npm run indexnow
